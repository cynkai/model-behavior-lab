name: Bug report
description: Something in mblab does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste personal data, account details, or API keys. If the bug involves
        recorded responses, reproduce it with `mblab demo` data if you can.
  - type: input
    id: version
    attributes:
      label: mblab version
      description: Output of `mblab --version` (the version and, when known, the git commit)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and OS
      placeholder: Python 3.12, macOS 15
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands you ran, in order.
      render: bash
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened
    validations:
      required: true

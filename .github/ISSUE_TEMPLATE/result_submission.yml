name: Result submission (app, recorded by hand)
description: Share a completed manual_ui study, collected by hand in an AI app, so others can check it.
title: "[Results] "
labels: [results]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for running the experiment. This form is for `manual_ui` studies (collected by
        hand in an app). For a study sent with `mblab run-api`, use the *official API* form.

        Before submitting:
        - run `mblab validate` and resolve every `possible_personal_data` warning;
        - read the responses yourself — the scan is a safety net, not a guarantee;
        - do not include account identifiers or personal data.

        Reviewers install the code named in your report's *Reproduction* section and run
        `mblab report --check` on your study directory, which must match your report.
  - type: input
    id: experiment
    attributes:
      label: Experiment id and version
      placeholder: chatgpt-model-selection-override 1.0.0
    validations:
      required: true
  - type: input
    id: hash
    attributes:
      label: Definition SHA-256
      description: Shown by `mblab plan` and at the top of the report.
    validations:
      required: true
  - type: input
    id: code
    attributes:
      label: model-behavior-lab version and commit
      description: The *Report made with* row of the report's Reproduction section.
      placeholder: model-behavior-lab 0.2.0, commit 0123456789abcdef…
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and client version(s)
      placeholder: ios, 1.2026.xxx
    validations:
      required: true
  - type: input
    id: dates
    attributes:
      label: Dates of data collection
    validations:
      required: true
  - type: input
    id: data
    attributes:
      label: Link to the study directory
      description: experiment.yaml, plan.json, records.jsonl, grades.jsonl (if any), reports/report.md
    validations:
      required: true
  - type: textarea
    id: deviations
    attributes:
      label: Deviations, notices, anything unusual
      description: Usage-limit notices, app updates mid-study, excluded runs, changes to the template.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: The data was collected by hand in the official client, without automation or interception.
          required: true
        - label: "`mblab validate` reports no errors, and I removed personal data."
          required: true
        - label: The data is observed (not generated by `mblab demo`).
          required: true

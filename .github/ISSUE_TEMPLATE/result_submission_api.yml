name: Result submission (official API)
description: Share a completed official_api study, sent with `mblab run-api`, so others can check it.
title: "[Results] "
labels: [results]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for running the experiment. This form is for `official_api` studies (every
        record written by `mblab run-api`). For a study recorded by hand in an app, use the
        *app* form.

        Before submitting:
        - run `mblab validate` and resolve every `possible_personal_data` warning;
        - make sure no API key, organization or project id, or other account identifier is in
          the shared files or this issue (`mblab` never writes the key, but check anything you
          added yourself);
        - share `api-unrecorded.jsonl` if the study has one: the report counts its entries.

        Reviewers install the code named in your report's *Reproduction* section and run
        `mblab report --check` on your study directory, which must match your report.
  - type: input
    id: experiment
    attributes:
      label: Experiment id and version
      placeholder: openai-reasoning-effort 1.0.0
    validations:
      required: true
  - type: input
    id: hash
    attributes:
      label: Definition SHA-256
      description: Shown by `mblab plan` and at the top of the report.
    validations:
      required: true
  - type: input
    id: code
    attributes:
      label: model-behavior-lab version and commit
      description: The *Report made with* row of the report's Reproduction section.
      placeholder: model-behavior-lab 0.2.0, commit 0123456789abcdef…
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model requested, and model id(s) the API reported
      description: "`api.model` in experiment.yaml, and the model ids in the report's API table."
    validations:
      required: true
  - type: input
    id: dates
    attributes:
      label: Dates the requests were sent
    validations:
      required: true
  - type: input
    id: data
    attributes:
      label: Link to the study directory
      description: experiment.yaml, plan.json, records.jsonl, grades.jsonl (if any), api-unrecorded.jsonl (if any), reports/report.md
    validations:
      required: true
  - type: textarea
    id: deviations
    attributes:
      label: Held or resent runs, errors, anything unusual
      description: Runs held back or sent again with --resend-unrecorded, stopped runs, changes to the template.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: Every record was written by `mblab run-api` through the provider's official API; none was typed in or edited by hand.
          required: true
        - label: No API key or account identifier is in the shared files or this issue.
          required: true
        - label: "`mblab validate` reports no errors, and I removed personal data."
          required: true
        - label: The data is observed (not generated by `mblab demo`).
          required: true
